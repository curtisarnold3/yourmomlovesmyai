name: Refresh live data

# Rebuilds the two live.json snapshots (Sector Pulse + Neocloud Contagion Monitor)
# and commits them. Each commit triggers a Vercel redeploy, so the pages pick up
# fresh numbers within a couple of minutes. No server, database or VPS needed.
on:
  schedule:
    - cron: "7 * * * 0-5"   # hourly at :07 UTC, Sun-Fri (covers Asia + US sessions)
  workflow_dispatch: {}     # "Run workflow" button for manual refreshes

permissions:
  contents: write

concurrency:
  group: refresh-live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/refresh/requirements.txt
      - run: pip install -r scripts/refresh/requirements.txt

      - name: Sector Pulse
        continue-on-error: true   # keep last good snapshot if Yahoo/News hiccups
        run: |
          python scripts/refresh/sector_pulse.py /tmp/pulse.json pages/02b-sector-pulse/assets/live.json
          python -c "import json;json.load(open('/tmp/pulse.json'))" && mv /tmp/pulse.json pages/02b-sector-pulse/assets/live.json

      - name: Neocloud Contagion Monitor
        continue-on-error: true
        run: |
          python scripts/refresh/neocloud_contagion.py pages/06b-neocloud-contagion/assets/live.json /tmp/contagion.json
          python -c "import json;json.load(open('/tmp/contagion.json'))" && mv /tmp/contagion.json pages/06b-neocloud-contagion/assets/live.json

      - name: Commit if changed
        run: |
          git config user.name  "live-data-bot"
          git config user.email "live-data-bot@users.noreply.github.com"
          git add pages/*/assets/live.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore(data): hourly live refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
